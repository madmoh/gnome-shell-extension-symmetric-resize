name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-bin nodejs zip

      - name: Lint the sources
        run: make lint

      - name: Create the package
        run: make checksum

      - name: Upload the package
        uses: actions/upload-artifact@v6
        with:
          name: symmetric-resize
          path: dist/
