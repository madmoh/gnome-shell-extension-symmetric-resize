name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-slim
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-bin zip

      - name: Check the tag version
        run: |
          version=$(sed -n 's/.*"version-name": "\(.*\)".*/\1/p' src/metadata.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata version $version." >&2
            exit 1
          fi

      - name: Create release files
        run: make checksum

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.shell-extension.zip \
            dist/*.sha256 \
            --generate-notes \
            --title "Symmetric Resize ${GITHUB_REF_NAME#v}" \
            --verify-tag
